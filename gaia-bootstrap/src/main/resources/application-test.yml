# =========================================================
# test profile：K8s / Docker Compose 部署
#   - 数据库 / Redis：通过 host.docker.internal 访问宿主机 docker 进程
#   - Dubbo 注册中心：Zookeeper（docker-compose 服务名 zookeeper）
# K8s 部署时通过 deploy/k8s/gaia-app.yaml 注入 env 覆盖下面默认值
# =========================================================

# ===================== 数据库 =====================
spring:
  datasource:
    # K8s 默认走签到库 `gaia`；通过 MYSQL_DB 环境变量可切换到 gaia_treasure 等。
    url: jdbc:mysql://${MYSQL_HOST:host.docker.internal}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

# ===================== MyBatis-Plus =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===================== Dubbo（Zookeeper 注册中心，接口级发现） =====================
dubbo:
  application:
    name: gaia-server
    qos-enable: false
    # preferred protocol（官方字段名 protocol）
    # tri Provider 必须设置此字段，否则 Dubbo 默认按 dubbo 协议找不到 endpoint
    protocol: tri
  registry:
    # ZK 注册中心：docker-compose 同网络下用服务名 zookeeper 直接互通
    address: zookeeper://zookeeper:2181?timeout=10000
  protocol:
    name: tri
    port: 20881
  provider:
    version: 1.0.0
  cloud:
    enabled: false
  # Dubbo 内部 tracing：本期不上 OTel starter，关闭 Dubbo 自带 tracing filter；
  # RPC 上下文依靠 W3C propagator 在全局 OTel 中传播。
