# =========================================================
# dev profile：本地开发
#   - 数据库 / Redis：宿主机 localhost（docker-compose 端口映射）
#   - Dubbo 注册中心：localhost:2181 的 Zookeeper
# =========================================================

# ===================== 数据库 =====================
spring:
  datasource:
    # 默认指向独立夺宝库 `gaia_treasure`，与签到库 `gaia` 物理隔离。
    # 通过 MYSQL_DB 环境变量可切换到任意库。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia_treasure}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4
  sql:
    init:
      mode: always
      # 加载全部库表（gaia + gaia_treasure），全部 CREATE IF NOT EXISTS，启动幂等
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

# ===================== MyBatis-Plus =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===================== Dubbo（Zookeeper 注册中心） =====================
dubbo:
  application:
    name: gaia-server
    qos-enable: false
    protocol: tri
  registry:
    address: zookeeper://localhost:2181?timeout=10000
  protocol:
    name: tri
    port: 20881
  provider:
    version: 1.0.0
  cloud:
    enabled: false

logging:
  level:
    com.gaia: DEBUG
    org.apache.dubbo: INFO
