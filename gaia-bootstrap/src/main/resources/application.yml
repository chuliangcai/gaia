# =========================================================
# Gaia 应用进程（Dubbo Provider + HTTP 8091）唯一配置
# 默认即本地开发：MySQL / Redis / Zookeeper 都在宿主机 localhost
#   - 端口 / 服务名 / Springdoc / 管理端点等与运行环境无关的配置直接写在主文档
#   - 数据库 / Redis / Dubbo 等连接参数用 ${ENV:default} 形式可被环境变量覆盖
# =========================================================

server:
  port: 8091

spring:
  application:
    name: gaia-server
  main:
    allow-bean-definition-overriding: true

  # ===================== 数据库 =====================
  datasource:
    # 所有业务（夺宝）共用一个库 `gaia`，通过 MYSQL_DB 环境变量可整体切换。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  # ===================== Redis =====================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4
  # 启动时幂等执行 schema.sql（本地开发常用；生产可改为 never 并交给 Flyway/Liquibase）
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

# ===================== MyBatis-Plus =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===================== Dubbo（Zookeeper 注册中心） =====================
dubbo:
  application:
    name: gaia-server
    qos-enable: false
    protocol: tri
  registry:
    address: zookeeper://${DUBBO_REGISTRY_ADDRESS:localhost:2181}?timeout=10000
  protocol:
    name: tri
    port: 20881
  provider:
    version: 1.0.0
  cloud:
    enabled: false

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,beans
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_RATE:1.0}
  observations:
    annotations:
      enabled: true
    enable:
      db.sql.observations: true
      db.connection.observations: true

logging:
  level:
    root: INFO
    com.gaia: DEBUG
    org.apache.dubbo: INFO
    org.apache.dubbo.config.spring.beans.factory.annotation: INFO
  pattern:
    # opentelemetry-logback-mdc-1.0 把 traceId / spanId 写入 MDC（key 为 trace_id / span_id）。
    console: "%d{HH:mm:ss.SSS} [%thread] [trace_id=%X{trace_id:-} span_id=%X{span_id:-}] %-5level %logger{36} - %msg%n"
