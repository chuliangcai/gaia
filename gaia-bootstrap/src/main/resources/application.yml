# =========================================================
# Gaia 应用进程公共配置（与具体运行环境无关）
# 数据库 / Redis / MyBatis-Plus 等具体连接配置放在各 profile 下：
#   - application-dev.yml   本地开发（docker-compose / localhost）
#   - application-test.yml  K8s 集群
#   - application-prod.yml  生产（按需新增）
# =========================================================

server:
  port: 8081

spring:
  application:
    name: gaia-server
  profiles:
    # 默认 dev（本地开发，docker-compose 起 ZK）；test / prod 通过 -Dspring.profiles.active= 切换
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,beans
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_RATE:1.0}
  observations:
    annotations:
      enabled: true
    enable:
      db.sql.observations: true
      db.connection.observations: true

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: INFO
    org.apache.dubbo.config.spring.beans.factory.annotation: INFO
  pattern:
    # opentelemetry-logback-mdc-1.0 把 traceId / spanId 写入 MDC（key 为 trace_id / span_id）。
    console: "%d{HH:mm:ss.SSS} [%thread] [trace_id=%X{trace_id:-} span_id=%X{span_id:-}] %-5level %logger{36} - %msg%n"
