# =========================================================
# Gaia 应用进程 K8s 资源（Dubbo 服务注册到 Zookeeper）
# 镜像基于 gaia-bootstrap 模块构建：`mvn -pl gaia-bootstrap -am -DskipTests package`
# 后 `docker build -t gaia-app:1.0.0 gaia-bootstrap/`，再 `kind load docker-image gaia-app:1.0.0`
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: gaia-app
  namespace: gaia
spec:
  # Headless Service: DNS 解析返回 Pod IP 而非 ClusterIP VIP
  # Dubbo Consumer 通过 ZK 拿到 Provider URL 后直连 Pod IP
  clusterIP: None
  selector:
    app: gaia-app
  ports:
    - name: tri
      port: 20881
      targetPort: 20881
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaia-app
  namespace: gaia
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gaia-app
  template:
    metadata:
      labels:
        app: gaia-app
    spec:
      # kind 集群访问宿主机本地 MySQL/Redis/Zipkin：
      # 在 /etc/hosts 静态注入 172.17.0.1 -> host.docker.internal
      # 让 Pod 用 host.docker.internal 访问宿主 docker 进程暴露的服务
      hostAliases:
        - ip: "172.19.0.1"
          hostnames:
            - "host.docker.internal"
      containers:
        - name: gaia-app
          # 本地 kind 部署：镜像通过 kind load docker-image gaia-app:1.0.0 加载
          image: gaia-app:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 20881
              name: tri
            - containerPort: 8081
              name: http
          env:
            # K8s 部署走 test profile：Dubbo 注册中心 = Zookeeper
            - name: SPRING_PROFILES_ACTIVE
              value: test
            # preferred protocol（官方字段名 protocol）
            - name: DUBBO_APPLICATION_PROTOCOL
              value: tri
            - name: MYSQL_HOST
              # 通过 host.docker.internal 访问宿主机 docker run 的 MySQL
              value: host.docker.internal
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DB
              value: gaia
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              # 宿主机 mysql-service 容器 MYSQL_ROOT_PASSWORD
              value: "12345"
            - name: REDIS_HOST
              value: host.docker.internal
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: ""
            - name: ZIPKIN_ENDPOINT
              value: http://host.docker.internal:9411/api/v2/spans
            - name: ZIPKIN_SAMPLING_RATE
              value: "1.0"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
