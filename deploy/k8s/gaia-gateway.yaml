# =========================================================
# Gaia Gateway 部署（仅消费 Dubbo，不注册服务）
# Dubbo 注册中心 = Zookeeper，不再需要 RBAC 访问 K8s API
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: gaia-gateway
  namespace: gaia
spec:
  type: ClusterIP
  selector:
    app: gaia-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaia-gateway
  namespace: gaia
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gaia-gateway
  template:
    metadata:
      labels:
        app: gaia-gateway
    spec:
      # kind 集群访问宿主机本地 Zipkin：
      # 在 /etc/hosts 静态注入 172.17.0.1 -> host.docker.internal
      hostAliases:
        - ip: "172.19.0.1"
          hostnames:
            - "host.docker.internal"
      containers:
        - name: gaia-gateway
          # 本地 kind 部署：镜像通过 kind load docker-image gaia-gateway:1.0.0 加载
          image: gaia-gateway:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            # K8s 部署走 test profile：Dubbo 注册中心 = Zookeeper
            - name: SPRING_PROFILES_ACTIVE
              value: test
            # Dubbo Consumer 必须按 tri 协议发现 Provider
            - name: DUBBO_APPLICATION_PROTOCOL
              value: tri
            - name: ZIPKIN_ENDPOINT
              value: http://host.docker.internal:9411/api/v2/spans
            - name: ZIPKIN_SAMPLING_RATE
              value: "1.0"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi