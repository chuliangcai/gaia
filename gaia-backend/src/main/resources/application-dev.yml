# =========================================================
# dev profile：本地开发
# 配置本地 MySQL 与基础设施层使用的连接信息，
# 通过 gaia-infra 的自动装配生效。
# =========================================================

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/gaia?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: AUTO

logging:
  level:
    com.gaia: DEBUG
