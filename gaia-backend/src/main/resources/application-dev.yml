# =========================================================
# dev profile：本地开发
# 配置本地 MySQL 与 Dubbo 消费端配置（backend 只做消费者，不发布服务）。
# =========================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: AUTO

# ===================== Dubbo（Zookeeper 注册中心，仅消费） =====================
dubbo:
  application:
    name: gaia-backend
    qos-enable: false
  registry:
    address: zookeeper://localhost:2181?timeout=10000
    register: false
  consumer:
    check: false
    timeout: 5000
    retries: 0
  cloud:
    enabled: false

logging:
  level:
    com.gaia: DEBUG
    org.apache.dubbo: INFO