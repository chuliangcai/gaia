# =========================================================
# Gaia Backend（后台管理 HTTP，端口 8092）唯一配置
# 默认即本地开发：连宿主机 localhost 上的 MySQL / Redis
#   - 端口 / 服务名 / Springdoc / 管理端点等与运行环境无关的配置直接写在主文档
#   - 数据库 / Redis 等连接参数用 ${ENV:default} 形式可被环境变量覆盖
# =========================================================

server:
  port: 8092
  servlet:
    context-path: /

spring:
  application:
    name: gaia-backend

  # ===================== 数据库 =====================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # ===================== Redis =====================
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4

# ===================== MyBatis-Plus =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: AUTO

# ===================== Springdoc OpenAPI =====================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: Gaia Backend Admin API
    description: Gaia 后台管理 HTTP 入口，对接 C 端互动平台数据
    version: 1.0.0
    contact:
      name: Gaia Team

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.gaia: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [trace_id=%X{trace_id:-} span_id=%X{span_id:-}] %-5level %logger{36} - %msg%n"
