# =========================================================
# dev profile：本地开发，Dubbo 注册中心 = Zookeeper
# ZK 由 docker-compose 启动并把 2181 映射到宿主机 localhost，所以这里写 localhost:2181
# =========================================================

# ===================== Dubbo（Zookeeper 注册中心） =====================
dubbo:
  application:
    name: gaia-gateway
    qos-enable: false
    protocol: tri
  registry:
    address: zookeeper://localhost:2181?timeout=10000
  protocol:
    name: tri
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0
  cloud:
    enabled: false

# ===================== Redis（Spring Session 存储后端） =====================
# gateway 通过 HttpSession 持有"当前用户 ID"，由 Spring Session 自动写入 Redis。
spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
  session:
    # 切完用户保持 2 小时，足够 dev 调试；生产可缩短或结合 remember-me
    timeout: 2h
    redis:
      namespace: gaia:session

logging:
  level:
    com.gaia: DEBUG
    org.apache.dubbo: INFO
