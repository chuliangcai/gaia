# ===================== 开发环境：Dubbo 直连，绕过注册中心 =====================
dubbo:
  # 覆盖默认的 K8s registry
  registry:
    address: # 留空 → Dubbo 走 @DubboReference(url=...) 直连

gaia:
  dubbo:
    sign:
      url: ${SIGN_DUBBO_URL:tri://127.0.0.1:20881/com.gaia.api.sign.SignService}

logging:
  level:
    com.gaia: DEBUG
    org.apache.dubbo: INFO
