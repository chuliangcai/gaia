# =========================================================
# dev profile：本地开发直连模式
# SignController 的 @DubboReference 去掉 url 后，dev 需要单独的方式让它直连：
#   通过 @PropertySource 或 VM 参数 -Dgaia.dubbo.sign.url=tri://127.0.0.1:20881/...
# 此处给出默认占位（运行时如未注入该变量，Dubbo 走注册中心发现；本地未启注册中心时会失败）
# =========================================================

# ===================== Dubbo（直连，无注册中心） =====================
dubbo:
  application:
    name: gaia-gateway
    qos-enable: false
  # 直连模式下 address 留空
  registry:
    address: N/A
  protocol:
    name: tri
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0
  cloud:
    enabled: false
  tracing:
    enabled: true
    tracing-exporter:
      zipkin-config:
        endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

logging:
  level:
    com.gaia: DEBUG
    org.apache.dubbo: INFO
