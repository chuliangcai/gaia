# 开发环境：Dubbo 走 @DubboReference(url=...) 直连，绕过注册中心
# （application / protocol / provider / consumer 全部继承 application.yml，不在此文件覆盖）

server:
  port: 8080

gaia:
  dubbo:
    sign:
      url: ${SIGN_DUBBO_URL:tri://127.0.0.1:20881/com.gaia.api.sign.SignService}

logging:
  level:
    com.gaia: DEBUG
    org.apache.dubbo: INFO
