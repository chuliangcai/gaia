server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gaia-gateway
  profiles:
    # 默认走 test（K8s 注册中心），开发时通过 -Dspring.profiles.active=dev 切换
    active: ${SPRING_PROFILES_ACTIVE:test}
  main:
    allow-bean-definition-overriding: true

# ===================== Dubbo 配置（默认/测试：K8s 注册中心） =====================
dubbo:
  application:
    name: gaia-gateway
    qos-enable: false
  registry:
    address: kubernetes://kubernetes.default.svc.cluster.local:443
    parameter:
      namespace: gaia
  protocol:
    name: tri
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0
  cloud:
    enabled: false

# ===================== 业务服务直连地址（仅 dev profile 使用） =====================
gaia:
  dubbo:
    sign:
      # 默认占位；dev profile 会覆盖
      url: ${SIGN_DUBBO_URL:}

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: WARN
