# =========================================================
# Gaia Gateway 公共配置（被 dev / test / prod 等 profile 共用）
# profile 切换通过环境变量 SPRING_PROFILES_ACTIVE；
#   - dev  : 本地直连（绕过注册中心）
#   - test : K8s 注册中心（kind / staging / 生产）
# =========================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gaia-gateway
  profiles:
    # 默认 test；本地开发通过 -Dspring.profiles.active=dev 切到直连
    active: ${SPRING_PROFILES_ACTIVE:test}
  main:
    allow-bean-definition-overriding: true
  # 关闭 Spring Boot 自带的 ZipkinAutoConfiguration，由 dubbo-spring-boot-tracing-brave-zipkin-starter 统一接管
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration

# ===================== Springdoc OpenAPI =====================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: Gaia Gateway API
    description: C 端互动平台统一 HTTP 网关，所有 Dubbo RPC 服务的 HTTP 入口
    version: 1.0.0
    contact:
      name: Gaia Team

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${ZIPKIN_SAMPLING_RATE:1.0}

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: WARN
  pattern:
    # Brave 的 Slf4jCurrentTraceContext 自动把 traceId/spanId 写入 MDC；未接入时显示 "-"
    console: "%d{HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-} spanId=%X{spanId:-}] %-5level %logger{36} - %msg%n"
