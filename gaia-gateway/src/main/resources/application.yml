# =========================================================
# Gaia Gateway 公共配置（被 dev / test / prod 等 profile 共用）
# profile 切换通过环境变量 SPRING_PROFILES_ACTIVE；
#   - dev  : 本地直连（绕过注册中心）
#   - test : K8s 注册中心（kind / staging / 生产）
# =========================================================

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gaia-gateway
  profiles:
    # 默认 test；本地开发通过 -Dspring.profiles.active=dev 切到直连
    active: ${SPRING_PROFILES_ACTIVE:test}
  main:
    allow-bean-definition-overriding: true

# ===================== Springdoc OpenAPI =====================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: Gaia Gateway API
    description: C 端互动平台统一 HTTP 网关，所有 Dubbo RPC 服务的 HTTP 入口
    version: 1.0.0
    contact:
      name: Gaia Team

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_RATE:1.0}

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: WARN
  pattern:
    # opentelemetry-logback-mdc-1.0 把 trace_id / span_id 写入 MDC（区别于之前 brave 的 traceId/spanId）。
    console: "%d{HH:mm:ss.SSS} [%thread] [trace_id=%X{trace_id:-} span_id=%X{span_id:-}] %-5level %logger{36} - %msg%n"
