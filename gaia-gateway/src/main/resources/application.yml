server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gaia-gateway
  profiles:
    # 默认走 test（K8s 注册中心），开发时通过 -Dspring.profiles.active=dev 切换
    active: ${SPRING_PROFILES_ACTIVE:test}
  main:
    allow-bean-definition-overriding: true

# ===================== Dubbo 配置（默认/测试：K8s 注册中心） =====================
dubbo:
  application:
    name: gaia-gateway
    qos-enable: false
  registry:
    address: kubernetes://kubernetes.default.svc.cluster.local:443
    parameter:
      namespace: gaia
  protocol:
    name: tri
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0
  cloud:
    enabled: false

# ===================== 业务服务直连地址（仅 dev profile 使用） =====================
gaia:
  dubbo:
    sign:
      # 默认占位；dev profile 会覆盖
      url: ${SIGN_DUBBO_URL:}

# ===================== Springdoc OpenAPI =====================
springdoc:
  api-docs:
    # 默认 /v3/api-docs，保持默认
    enabled: true
  swagger-ui:
    # 默认 /swagger-ui.html
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  # 应用基本信息（也可在 Java 代码里通过 OpenAPI Bean 注入）
  info:
    title: Gaia Gateway API
    description: C 端互动平台统一 HTTP 网关，所有 Dubbo RPC 服务的 HTTP 入口
    version: 1.0.0
    contact:
      name: Gaia Team

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: WARN
  pattern:
    # SkyWalking 9.x/10.x agent 自动把 traceId 写入 MDC key=traceId；未接入时显示 "-"
    console: "%d{HH:mm:ss.SSS} [%thread] [tid=%X{traceId:-}] %-5level %logger{36} - %msg%n"
