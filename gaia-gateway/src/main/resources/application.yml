# =========================================================
# Gaia Gateway（C 端 HTTP 入口，端口 8090）唯一配置
# 默认即本地开发：Dubbo 注册中心 = 宿主机 localhost 上的 Zookeeper
#   - 端口 / 服务名 / Springdoc / 管理端点等与运行环境无关的配置直接写在主文档
#   - Dubbo / Redis 等连接参数用 ${ENV:default} 形式可被环境变量覆盖
# =========================================================

server:
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: gaia-gateway
  main:
    allow-bean-definition-overriding: true
  # ===================== Redis（Spring Session 存储后端） =====================
  # gateway 通过 HttpSession 持有"当前用户 ID"，由 Spring Session 自动写入 Redis。
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
  session:
    # 切完用户保持 2 小时，足够本地调试
    timeout: 2h
    redis:
      namespace: gaia:session

# ===================== Dubbo（Zookeeper 注册中心） =====================
dubbo:
  application:
    name: gaia-gateway
    qos-enable: false
    protocol: tri
  registry:
    address: zookeeper://${DUBBO_REGISTRY_ADDRESS:localhost:2181}?timeout=10000
  protocol:
    name: tri
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0
  cloud:
    enabled: false

# ===================== Springdoc OpenAPI =====================
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: Gaia Gateway API
    description: C 端互动平台统一 HTTP 网关，所有 Dubbo RPC 服务的 HTTP 入口
    version: 1.0.0
    contact:
      name: Gaia Team

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_RATE:1.0}

logging:
  level:
    root: INFO
    com.gaia: DEBUG
    org.apache.dubbo: INFO
  pattern:
    # opentelemetry-logback-mdc-1.0 把 trace_id / span_id 写入 MDC（区别于之前 brave 的 traceId/spanId）。
    console: "%d{HH:mm:ss.SSS} [%thread] [trace_id=%X{trace_id:-} span_id=%X{span_id:-}] %-5level %logger{36} - %msg%n"
