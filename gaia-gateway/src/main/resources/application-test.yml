# =========================================================
# test profile：Docker Compose 部署（docker-compose.yml 同网络）
# Dubbo 注册中心 = Zookeeper（docker-compose 服务名直接互通）
# =========================================================

# ===================== Dubbo（Zookeeper 注册中心，接口级订阅） =====================
dubbo:
  application:
    name: gaia-gateway
    qos-enable: false
    # Consumer 默认按 dubbo 协议发现；test 环境必须用 tri 才能与 Provider tri 20881 匹配
    protocol: tri
  registry:
    # ZK 注册中心：docker-compose 同网络下用服务名 zookeeper 直接互通
    address: zookeeper://zookeeper:2181?timeout=10000
  protocol:
    name: tri
    port: -1
  consumer:
    check: false
    timeout: 3000
    retries: 0
  cloud:
    enabled: false
  # Dubbo 内部 tracing filter 关闭；RPC 上下文依靠 W3C propagator 在全局 OTel 中传播。

# ===================== Redis（Spring Session 存储后端） =====================
# gateway 通过 HttpSession 持有"当前用户 ID"，由 Spring Session 自动写入 Redis。
spring:
  data:
    redis:
      host: ${REDIS_HOST:host.docker.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
  session:
    timeout: 2h
    redis:
      namespace: gaia:session

# test profile 走 ZK 注册中心发现，不再用 @DubboReference url 直连