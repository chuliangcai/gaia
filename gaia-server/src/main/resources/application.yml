# =========================================================
# Gaia Server 公共配置（被 dev / test / prod 等 profile 共用）
# =========================================================

server:
  port: 8081

spring:
  application:
    name: gaia-server
  profiles:
    # 默认 test（K8s）；本地开发通过 -Dspring.profiles.active=dev 切到无注册中心模式
    active: ${SPRING_PROFILES_ACTIVE:test}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  main:
    allow-bean-definition-overriding: true

# ===================== MyBatis-Plus =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,beans
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_RATE:1.0}
  observations:
    annotations:
      enabled: true
    enable:
      db.sql.observations: true
      db.connection.observations: true

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: INFO
    org.apache.dubbo.config.spring.beans.factory.annotation: INFO
  pattern:
    # opentelemetry-logback-mdc-1.0 把 traceId / spanId 写入 MDC（key 为 trace_id / span_id）。
    console: "%d{HH:mm:ss.SSS} [%thread] [trace_id=%X{trace_id:-} span_id=%X{span_id:-}] %-5level %logger{36} - %msg%n"
