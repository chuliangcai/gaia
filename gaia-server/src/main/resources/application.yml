server:
  port: 8081

spring:
  application:
    name: gaia-server
  profiles:
    # 默认走 test（K8s 注册中心），开发时通过 -Dspring.profiles.active=dev 切换
    active: ${SPRING_PROFILES_ACTIVE:test}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  data:
    redis:
      # Spring Data Redis（Lettuce 驱动；Spring Boot 3.2 默认自动接入 Micrometer Tracing）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4
  sql:
    init:
      # 启动时自动执行 classpath:db/schema.sql（幂等：CREATE TABLE IF NOT EXISTS）
      # 生产环境建议改为 embedded 或 never，并由 Flyway 等专业工具接管
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  main:
    allow-bean-definition-overriding: true
  # 关闭 Spring Boot 自带的 ZipkinAutoConfiguration，由 dubbo-spring-boot-tracing-brave-zipkin-starter 统一接管
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration

# ===================== Dubbo =====================
dubbo:
  application:
    name: gaia-server
    qos-enable: false
  registry:
    address: kubernetes://kubernetes.default.svc.cluster.local:443
    parameter:
      namespace: gaia
  protocol:
    name: tri
    port: 20881
  provider:
    version: 1.0.0
  cloud:
    enabled: false
  # 全链路追踪（Brave/Zipkin，由 dubbo-spring-boot-tracing-brave-zipkin-starter 装配）
  tracing:
    enabled: true
    # propagation 是 PropagationConfig 嵌套类型，Dubbo 3.2.x 默认即 B3，不再在 YAML 配置
    tracing-exporter:
      zipkin-config:
        endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

# ===================== MyBatis-Plus =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===================== Redis =====================
# Redis 配置已迁移到 spring.data.redis.*（Lettuce 驱动）

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,beans
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  # 采样率（1.0 全采样；按需调整为 0.1 / 0.01）
  tracing:
    sampling:
      probability: ${ZIPKIN_SAMPLING_RATE:1.0}
  observations:
    annotations:
      enabled: true
    enable:
      # datasource-micrometer-spring-boot：把每条 SQL 包装为 Observation →
      # 经 micrometer-tracing-bridge-brave 转成 Brave span，Zipkin UI 中可见。
      db.sql.observations: true
      # 连接获取也建 span（连接池等待耗时可观时建议开启）
      db.connection.observations: true

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: WARN
  pattern:
    # Brave 的 Slf4jCurrentTraceContext 自动把 traceId/spanId 写入 MDC；未接入时显示 "-"
    console: "%d{HH:mm:ss.SSS} [%thread] [traceId=%X{traceId:-} spanId=%X{spanId:-}] %-5level %logger{36} - %msg%n"
