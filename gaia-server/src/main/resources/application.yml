server:
  port: 8081

spring:
  application:
    name: gaia-server
  profiles:
    # 默认走 test（K8s 注册中心），开发时通过 -Dspring.profiles.active=dev 切换
    active: ${SPRING_PROFILES_ACTIVE:test}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:gaia}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  main:
    allow-bean-definition-overriding: true

# ===================== Dubbo =====================
dubbo:
  application:
    name: gaia-server
    qos-enable: false
  registry:
    address: kubernetes://kubernetes.default.svc.cluster.local:443
    parameter:
      namespace: gaia
  protocol:
    name: tri
    port: 20881
  provider:
    version: 1.0.0
  cloud:
    enabled: false

# ===================== MyBatis-Plus =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# ===================== Redis =====================
gaia:
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 2000
    pool:
      max-total: 64
      max-idle: 16
      min-idle: 4

# ===================== 监控 =====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,beans
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.gaia: INFO
    org.apache.dubbo: WARN
  pattern:
    # SkyWalking 9.x/10.x agent 自动把 traceId 写入 MDC key=traceId；未接入时显示 "-"
    console: "%d{HH:mm:ss.SSS} [%thread] [tid=%X{traceId:-}] %-5level %logger{36} - %msg%n"
