# 开发环境：仅调整日志级别。
# Dubbo Provider 通过启动参数 -Ddubbo.registry.register=false 跳过 K8s 注册中心推送
# （避免 dev profile 改写 dubbo.registry.* 段导致 application/protocol 被覆盖）

server:
  port: 8081

logging:
  level:
    com.gaia: DEBUG
    org.apache.dubbo: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] [tid=%X{traceId:-}] %-5level %logger{36} - %msg%n"